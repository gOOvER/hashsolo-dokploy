services:
  bitcoind:
    image: bitcoin/bitcoin:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8333:8333/tcp"
    expose:
      - "8332"
      - "3000"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    command:
      - -server=1
      - -printtoconsole=0
      - -debug=0
      - -nodebuglogfile
      - -rpcuser=${BITCOIN_RPC_USER:-hashsolo}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-changeme}
      - -rpcallowip=10.0.0.0/8
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=192.168.0.0/16
      - -rpcallowip=127.0.0.1
      - -rpcbind=0.0.0.0
      - -zmqpubhashblock=tcp://0.0.0.0:3000
      - -prune=${BITCOIN_PRUNE:-550}
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -rpcuser=${BITCOIN_RPC_USER:-hashsolo} -rpcpassword=${BITCOIN_RPC_PASSWORD:-changeme} getblockchaininfo >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

  hashsolo:
    image: ghcr.io/goover/hashsolo:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      bitcoind:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STRATUM_PORT:-3333}:3333/tcp"
    expose:
      - "${API_PORT:-3334}"
    volumes:
      - hashsolo-db:/hashsolo/DB
    environment:
      NODE_ENV: production
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-http://bitcoind}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-hashsolo}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-changeme}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      BITCOIN_RPC_TIMEOUT: ${BITCOIN_RPC_TIMEOUT:-10000}
      BITCOIN_RPC_COOKIEFILE: ${BITCOIN_RPC_COOKIEFILE:-}
      BITCOIN_ZMQ_HOST: ${BITCOIN_ZMQ_HOST:-tcp://bitcoind:3000}
      API_PORT: ${API_PORT:-3334}
      API_SECURE: ${API_SECURE:-false}
      STRATUM_PORT: ${STRATUM_PORT:-3333}
      STRATUM_MAX_CONNECTIONS_PER_LISTENER: ${STRATUM_MAX_CONNECTIONS_PER_LISTENER:-10000}
      STRATUM_START_DIFF: ${STRATUM_START_DIFF:-0.001}
      VARDIFF_TARGET_TIME: ${VARDIFF_TARGET_TIME:-10}
      VARDIFF_MIN_DIFF: ${VARDIFF_MIN_DIFF:-0.00001}
      NETWORK: ${NETWORK:-mainnet}
      DEV_FEE_ADDRESS: ${DEV_FEE_ADDRESS:-}
      POOL_IDENTIFIER: ${POOL_IDENTIFIER:-HashSolo}
      SHARE_SUBMISSION_API_KEY: ${SHARE_SUBMISSION_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_CLIENTID: ${DISCORD_BOT_CLIENTID:-}
      DISCORD_BOT_GUILD_ID: ${DISCORD_BOT_GUILD_ID:-}
      DISCORD_BOT_CHANNEL_ID: ${DISCORD_BOT_CHANNEL_ID:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      BEST_DIFF_ALERT_MIN: ${BEST_DIFF_ALERT_MIN:-1}
      DEVICE_NOTIFICATIONS_ENABLED: ${DEVICE_NOTIFICATIONS_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||3334)+'/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default

  hashsolo-ui:
    image: ghcr.io/goover/hashsolo-ui:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      hashsolo:
        condition: service_healthy
    expose:
      - "80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-hashsolo:3334}
      PUBLIC_POOL_API_URL: ${PUBLIC_POOL_API_URL:-}
      PUBLIC_POOL_STRATUM_URL: ${PUBLIC_POOL_STRATUM_URL:-}
      DONATION_BTC_ADDRESS: ${DONATION_BTC_ADDRESS:-}
      DONATION_URL: ${DONATION_URL:-}
      DONATION_LINK_LABEL: ${DONATION_LINK_LABEL:-}
      DONATION_TITLE: ${DONATION_TITLE:-}
      DONATION_SUBTITLE: ${DONATION_SUBTITLE:-}
      LOGLEVEL: ${UI_LOGLEVEL:-INFO}
      LOGFORMAT: ${UI_LOGFORMAT:-json}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network

volumes:
  bitcoind-data:
  hashsolo-db:

networks:
  default:
  dokploy-network:
    external: true
